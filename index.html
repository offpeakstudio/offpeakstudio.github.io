<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/favicon.png" sizes="48x48">

  <title>off-peak studio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fascinate+Inline&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/top.css">
</head>

<body>

  <main class="terminal">

    <!-- HEADER -->
    <div class="terminal-header">

      <span class="logo">
        OFF-PEAK STUDIO
      </span>

      <span class="terminal-title">
        ACCESS TERMINAL
      </span>

    </div>


    <!-- DISPLAY -->
    <div class="display">

      <div class="display-label">
        ENTER ACCESS CODE
      </div>

      <div id="codeDisplay" class="code-display">

        <span>_</span>
        <span>_</span>
        <span>_</span>
        <span>_</span>

      </div>

      <div id="status" class="status">
        READY
      </div>

    </div>


    <!-- KEYPAD -->
    <div class="keypad">

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>

      <button class="key key-clear">C</button>

      <button class="key" data-number="0">0</button>

      <button class="key key-enter">
        ENTER
      </button>

    </div>


    <!-- FOOTER -->
    <div class="terminal-footer">
      OFF-PEAK STUDIO / SYSTEM VER1.0
    </div>

  </main>


  <script src="js/top.js"></script>

</body>
</html>
